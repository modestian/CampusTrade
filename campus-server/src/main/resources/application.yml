server:
  port: 8082

spring:
  application:
    name: campus-trade
  profiles:
    active: dev
  main:
    allow-circular-references: true
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10

mybatis-plus:
  # mapper 配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.campus.pojo.entity
  configuration:
    # 开启驼峰命名
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com:
      campus:
        mapper: debug
        service: info
        controller: info

campus:
  # JWT 双端配置
  jwt:
    student-secret-key: campus-student-2026
    student-ttl: 86400000
    student-token-name: token
    admin-secret-key: campus-admin-2026
    admin-ttl: 86400000
    admin-token-name: admin-token
  # 前端目录（前后端分离：独立于 Maven 工程）
  web:
    base-dir: ../campus-web
  # 订单策略
  order:
    # 超时处理策略：rabbitmq（默认）/ redis（紧急回退）
    timeout-strategy: rabbitmq
    # 待支付超时（分钟）
    pay-timeout-minutes: 15
    # 发货后自动收货天数
    auto-receive-days: 7
  mq:
    outbox:
      publish-interval-ms: 5000
      retention-days: 7
      cleanup-cron: "0 0 3 * * ?"
    order-timeout:
      retry-delay-ms: 30000
